name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    env:
      # Safe build-time dummy placeholders (CI does not require real production credentials)
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_dummy_publishable_key
      CLERK_SECRET_KEY: sk_test_ci_dummy_secret_key
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      DATABASE_URL: postgresql://postgres:dummy@localhost:5432/postgres
      DIRECT_URL: postgresql://postgres:dummy@localhost:5432/postgres
      GEMINI_API_KEY: ci_dummy_gemini_key
      ARCJET_KEY: ajkey_ci_dummy_key
      ARCJET_ENV: development
      NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci_dummy_supabase_anon_key
      SUPABASE_SERVICE_ROLE_KEY: ci_dummy_supabase_service_key
      VERCEL_TOKEN: ci_dummy_vercel_token
      LIVEBLOCKS_SECRET_KEY: sk_prod_ci_dummy_liveblocks_key
      NEXT_PUBLIC_LIVEBLOCKS_PUBLIC_KEY: pk_prod_ci_dummy_liveblocks_key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Type Check (TypeScript)
        run: npx tsc --noEmit

      - name: Lint (ESLint 9)
        run: npm run lint

      - name: Unit & Integration Tests (Vitest)
        run: npm test

      - name: Production Build (Next.js 16 Turbopack)
        env:
          NODE_ENV: production
        run: npm run build

